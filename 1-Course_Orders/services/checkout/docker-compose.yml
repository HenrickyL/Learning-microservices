version: '3.8'
services:
  # app:
  #   build: .
  #   ports:
  #     - "${PORT}:${PORT}"
  #   volumes:
  #     - .:/app
  #   env_file:
  #   - .env
  #   environment:
  #     - DATABASE_URL=${DATABASE_URL}
  #     - PORT=${PORT}
  #   depends_on:
  #     - postgres

  postgres:
    image: postgres:14
    restart: always
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${DB_PORT}:${DB_PORT}'
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
        - ${DB_PORT}

volumes:
  pgdata:
