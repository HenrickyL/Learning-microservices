server:
    port: 8080
spring:
  datasource:
    url: jdbc:h2:mem:accountsdb #${SPRING_DATASOURCE_URL}
    driver-class-name: org.h2.Driver #${SPRING_DRIVER_CLASS_NAME}
    username: sa #${SPRING_DATASOURCE_USERNAME}
    password: '' #${SPRING_DATASOURCE_PASSWORD}
  h2:
    console:
      enabled: true
#      path: /h2-console  # URL de acesso ao console
#      settings:
#        web-allow-others: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true